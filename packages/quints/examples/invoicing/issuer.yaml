# yaml-language-server: $schema=https://sealambda.github.io/quints/schema/issuer.schema.json
# Issuer identity for `quints invoice` — name, address, VAT ID, and one
# bank account per invoicing currency. The identity is the tool maker's,
# so the demo renders a finished invoice; the accounts are documentation
# IBANs and belong to nobody. Replace every field before issuing.
name: Sealambda GmbH
address:
  - Sulzerstrasse 1
  - 4528 Zuchwil
vat_id: CHE-267.359.056 MWST
email: receivables@sealambda.com
phone: "+41 76 297 79 35"
# Sample accounts — the standard documentation IBANs, valid but
# belonging to nobody. Replace all of them with your own.
bank:
  CHF:
    # Every CHF QR-bill is paid into this account with ONE of two reference
    # schemes — the account decides which. When to use which:
    # https://sealambda.github.io/quints/guides/payment-references/
    #
    # A) Swiss QR reference (QRR) — the default as soon as a QR-IBAN is present.
    #    The payer's bank refuses any payment to a QR-IBAN without a valid
    #    reference, so every payment arrives matchable. Needs the QR-IBAN (a
    #    second account number your bank issues; this sample carries
    #    PostFinance's QR-IID 30000) and the six-digit identification the bank
    #    assigns you (UBS: BESR-ID). Uncomment both lines to switch:
    # qr_iban: CH57 3000 0123 0008 8901 2
    # qr_reference_id: "123456"
    #
    # B) Creditor reference (SCOR, RF…) — what the regular IBAN alone gives you:
    #    it spells out the invoice number and is valid in CHF and EUR and in
    #    SEPA. To keep it after adding a QR-IBAN, uncomment:
    # reference: scor
    #
    # The regular IBAN stays either way — CHF paid from abroad needs it.
    iban: CH93 0076 2011 6238 5295 7
    bic: POFICHBEXXX
    bank_name: PostFinance AG, Bern
  EUR:
    # Regular IBAN — foreign transfers can't use the QR-bill scheme.
    iban: DE89 3704 0044 0532 0130 00
    # BIC is mandatory here: an export invoice won't render without
    # one, and a payer who guesses it gets the transfer returned.
    # Ask your bank — `quints iban` checks the pair. bank_name is
    # optional and lets the payer sanity-check the BIC.
    bic: COBADEFFXXX
    bank_name: Commerzbank AG, Köln
# Typography and palette default to the bundled Sealambda brand — Geist,
# Newsreader and Geist Mono with the Tyrian palette (`quints schema` lists
# every token). The logo is the one asset opted into by path.
brand:
  logo: invoicing/wordmark.svg
  logo_height: 9 # mm
