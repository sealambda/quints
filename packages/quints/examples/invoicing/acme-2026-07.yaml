# yaml-language-server: $schema=https://sealambda.github.io/quints/schema/invoice.schema.json
# Sample domestic invoice — a Swiss QR-bill. It ties to the ^INV2026014
# booking in books/2026.bean (net 1'000.00 + 8.1% VAT = 1'081.00), so
# `quints invoice` cross-checks it clean against the ledger.
number: INV2026014
kind: domestic
currency: CHF
issue_date: 2026-07-02
supply: Juli 2026
customer: acme
# The customer's own reference for this invoice — their PO number. It is
# printed next to the invoice number and travels in the QR-bill's structured
# billing information, so their accounts-payable software can match it.
customer_reference: PO-2026-118
items:
  - description: Consulting — July
    quantity: 1
    unit_price: 1000.00
    unit: Pauschal
locale: de_CH
