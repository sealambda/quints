# Docs site (https://sealambda.github.io/quints/). Build: `make docs`,
# preview: `make docs-serve`. Zensical is pinned in pyproject.toml — see the
# docs dependency group. Every quints command shown in docs/ is executed by
# packages/quints/tests/test_docs.py; docs that don't run don't merge.

[project]
site_name = "quints"
site_description = "Swiss VAT and accounting for plain-text (beancount) books — MWST returns, QR-bill invoicing, KMU statutory statements, statement importers."
site_url = "https://sealambda.github.io/quints/"
repo_url = "https://github.com/sealambda/quints"
copyright = "Copyright &copy; 2026 Sealambda GmbH — GPL-2.0-only"

nav = [
    { "quints" = "index.md" },
    { "Getting started" = "getting-started.md" },
    { "Legal forms" = "legal-forms.md" },
    { "Guides" = [
        { "Register, switch method, deregister" = "guides/vat-registration.md" },
        { "File your VAT return" = "guides/vat.md" },
        { "Import statements" = "guides/importing.md" },
        { "Invoicing" = "guides/invoicing.md" },
        { "Get paid before you invoice" = "guides/pro-forma.md" },
        { "Payment references" = "guides/payment-references.md" },
        { "Allocate customer payments" = "guides/receivables.md" },
        { "Statutory reports" = "guides/reports.md" },
        { "Close the year" = "guides/year-end.md" },
        { "FX rates" = "guides/fx.md" },
    ] },
    { "Reference" = [
        { "quints.toml" = "reference/configuration.md" },
        { "How quints fills the VAT return" = "reference/vat-rules.md" },
        { "Working with AI agents" = "reference/ai-agents.md" },
    ] },
]

# For AI agents: /llms.txt indexes a Markdown copy of every page (the
# llmstxt.org convention), /llms-full.txt is all of them in one file. A page
# missing from `sections` is missing from both — list new top-level pages.
[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = """
quints is a deterministic CLI: it never calls a model, and every reporting \
command takes `--json`. Numbers that are filed come from quints, never from a \
model. Each page opens with an "Applies if" block (legal form, VAT status, \
method) and footnotes its legal claims to the source.\
"""

[project.plugins.llmstxt.sections]
"Getting started" = ["index.md", "getting-started.md", "legal-forms.md"]
"Guides" = ["guides/*.md"]
"Reference" = ["reference/*.md"]

[project.theme]
language = "en"
features = [
    "content.action.copy",  # "Copy as Markdown", from the llmstxt copies below
    "content.code.copy",
    "content.code.annotate",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/sealambda/quints"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
