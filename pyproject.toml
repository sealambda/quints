# Workspace root — not a package itself; the distributions live in packages/.
[project]
name = "quints-monorepo"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "quints[lsp]",
    "beangulp-mt940",
    "beangulp-stripe",
    "beangulp-wise[sca]",
    "beangulp-yapeal",
    "beanprice-bazg",
    "quints-mailroom",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "beanprice>=2.1",
    "deptry>=0.25.1",
    "factur-x>=7.9",
    "hypothesis>=6.170.15",
    "import-linter>=2.13",
    "lxml>=6.1.3",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "saxonche>=13.1.1",
    "vulture>=2.16",
]
# Zensical is beta (0.x) and its interfaces may still change — pin exactly,
# bump deliberately after checking the release notes.
docs = [
    "zensical==0.1.1",
]

[tool.uv]
# Lock for patched 3.11+ only: soupsieve's fixed releases need >= 3.11.5, and the
# older fork kept the vulnerable 2.10 in uv.lock (GHSA-mmhr-3c5m-f64f).
# Not emscripten: the mailroom's agent SDK forks the resolution there, and
# saxonche (like beancount itself) ships no wasm wheel.
environments = ["python_full_version >= '3.11.5' and sys_platform != 'emscripten'"]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
quints = { workspace = true }
beangulp-mt940 = { workspace = true }
beangulp-stripe = { workspace = true }
beangulp-wise = { workspace = true }
beangulp-yapeal = { workspace = true }
beanprice-bazg = { workspace = true }
quints-mailroom = { workspace = true }

# ---------------------------------------------------------------------------
# Quality tooling. Single entrypoint: `make check` (see Makefile).
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
    "packages/quints/src",
    "packages/beangulp-mt940/src",
    "packages/beangulp-stripe/src",
    "packages/beangulp-wise/src",
    "packages/beangulp-yapeal/src",
    "packages/beanprice-bazg/src",
    "packages/quints-mailroom/src",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "BLE",      # blind except — catch what you can handle, name it
    "C4",       # comprehensions
    "SIM",      # simplify
    "S",        # bandit (security)
    "RUF",      # ruff-specific
]
ignore = [
    "B008",             # function call in default — the standard typer.Option/Argument idiom
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode — de/fr/it strings are core content here
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106"]  # asserts and hardcoded test credentials are fine in tests

[tool.pytest.ini_options]
# A warning in our code or a dependency is a defect until triaged.
filterwarnings = ["error"]
addopts = "-ra --strict-markers"

[tool.basedpyright]
include = ["packages"]
exclude = ["**/.venv", "**/__pycache__", "dist"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# beancount/beangulp/fava ship no type stubs — Unknown-type diagnostics on their
# APIs are unfixable noise, so only the Unknown* family is relaxed from strict.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false

[tool.vulture]
paths = ["packages"]
exclude = ["*/.venv/*", "*/tests/*"]
min_confidence = 80
ignore_names = ["cls"]  # pydantic @field_validator signature

[tool.importlinter]
root_packages = [
    "quints",
    "beangulp_mt940",
    "beangulp_stripe",
    "beangulp_wise",
    "beangulp_yapeal",
    "beanprice_bazg",
    "quints_mailroom",
]

# Layers within quints, top to bottom. Modules on the same line (":") may
# import each other; a module may only import from lines below its own.
# exhaustive: adding a new module without placing it in a layer is an error.
[[tool.importlinter.contracts]]
name = "quints is layered: entrypoints -> orchestration -> domain -> foundation"
type = "layers"
containers = ["quints"]
exhaustive = true
layers = [
    "cli : fava : lsp : plugins",
    "settlement : ech0217 : report_pdf : match : importing : init : closing : liability : audit : changes : digest : bundle",
    "mwst : kmu : vat : fx : prices : inbox : payables : receivables : invoice",
    "config : ledger : ui : diagnostics",
]

[[tool.importlinter.contracts]]
name = "standalone importers stay standalone"
type = "independence"
modules = ["beangulp_mt940", "beangulp_stripe", "beangulp_wise", "beangulp_yapeal", "beanprice_bazg", "quints_mailroom"]

# The mailroom drives quints through the agent (CLI in the books repo),
# never as a library import — the AI/deterministic boundary is a process
# boundary, and this keeps it that way.
[[tool.importlinter.contracts]]
name = "building blocks never depend on quints"
type = "forbidden"
source_modules = ["beangulp_mt940", "beangulp_stripe", "beangulp_wise", "beangulp_yapeal", "beanprice_bazg", "quints_mailroom"]
forbidden_modules = ["quints"]

# Modules sharing a layer (":") may import each other, but never in a cycle.
[[tool.importlinter.contracts]]
name = "no import cycles between quints modules"
type = "acyclic_siblings"
ancestors = ["quints"]
# Type-only import (under TYPE_CHECKING): no runtime cycle.
ignore_imports = ["quints.invoice.reference -> quints.invoice.model"]
