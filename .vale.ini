# Prose lint settings of every Sealambda repository.
# https://docs.vale.sh/topics/.vale.ini
# Run `vale sync` once to install the packages into StylesPath.
# Vocabularies live in StylesPath/config/vocabularies. The hub syncs
# Sealambda, the terms of the organization. Each repository keeps its own
# terms in Repository/accept.txt and must create that file, even if empty:
# Vale stops with an error when a listed vocabulary is missing.
StylesPath = .vale/styles
Vocab = Sealambda, Repository

Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, https://github.com/vale-cli/readability/releases/download/v0.2.0/Readability.zip

[*.md]
BasedOnStyles = Vale, Microsoft, Readability
