# Link check settings of this repository. https://lychee.cli.rs
#
# The check is offline. It resolves relative links and file paths. A check of
# external links would fail on other people's outages and rate limits.
offline = true

# A link to a missing heading fails, for `page.md#heading` and for `#heading`.
# lychee 0.24 reads the headings of a local file offline. `anchor-only` checks
# anchors and skips text fragments, which only a browser can check.
include_fragments = "anchor-only"

exclude_path = [
  ".git",
  "node_modules",
]
