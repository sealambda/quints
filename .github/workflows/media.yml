# Regenerate docs/assets/ (terminal GIFs from media/*.tape, PDF page previews)
# and commit the result. Manual trigger only: VHS output is not byte-stable
# across platforms/fonts, so this runs on demand — typically before a release —
# rather than as a PR check. The tapes themselves fail loudly if a command breaks.
name: Media

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate docs media
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # push the regenerated assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --all-packages
      - name: Install vhs, ttyd, ffmpeg, poppler
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt-get update
          sudo apt-get install -y vhs ttyd ffmpeg poppler-utils
      - name: Configure git identity
        # Global, not repo-local: the tapes run `quints init` in throwaway
        # directories, and its scaffold commit fails (visibly, inside the
        # recording) without an identity there.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: make media
      # Only this step holds the token: gh is git's credential helper here.
      - name: Commit regenerated assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git add docs/assets
          git diff --cached --quiet && echo "assets unchanged" && exit 0
          git commit -m "chore: regenerate docs media"
          git push
