# `make check` split into jobs, the PDF/A validation, the build, and the hub's
# checks: `nix flake check` (formatting, actionlint, zizmor, typos), markdownlint
# and lychee. Drafts skip it (the organization's CONTRIBUTING.md).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Weekly, so dependency, validator and link drift shows up between pull requests.
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Static checks
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --all-packages
      - run: make static

  test:
    name: Tests (Python ${{ matrix.python-version }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-packages
      - run: uv run pytest packages -q
      # Weekly: many more generated cases, and legal sources nobody has
      # re-read for a year fail the run.
      - name: Property tests, deep profile
        if: ${{ github.event_name == 'schedule' }}
        env:
          QUINTS_WEEKLY: "1"
        run: uv run pytest packages/quints/tests/test_properties.py -q

  # The invoices claim PDF/A-3a + PDF/UA-1; veraPDF checks they are.
  pdf:
    name: PDF/A and PDF/UA validation
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --all-packages
      - run: make pdfcheck

  build:
    name: Build distributions
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --all-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # No job lints the workflows: treefmt in the flake check runs actionlint and zizmor.
  flake-check:
    name: nix flake check
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix flake check -L

  # The hub's docs.yml minus Vale: the synced Vale config flags the verbatim
  # German statute quotations and the house style (spaced em dashes), so Vale
  # waits for a hub-side rule change. Same commands as the hub otherwise.
  docs-lint:
    name: markdownlint and lychee
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: markdownlint-cli2
        run: nix develop -c markdownlint-cli2 "**/*.md"
      - name: lychee
        run: nix develop -c lychee --no-progress "**/*.md"
      # The legal sources the rate tables cite (ledger.RATE_SOURCES). The synced
      # lychee.toml is offline-only, so this one run goes without it.
      - name: lychee on the cited legal sources
        if: ${{ github.event_name == 'schedule' }}
        run: nix develop -c lychee --no-progress --config /dev/null packages/quints/src/quints/ledger.py
