# Every job runs one command that a contributor can run too: CONTRIBUTING.md
# has the table. All jobs run on GitHub-hosted runners, drafts included.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so dependency, validator and link drift shows up between pull requests.
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --all-packages
      - run: make static

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-packages
      - run: uv run pytest packages -q
      # Weekly: many more generated cases, and legal sources nobody has
      # re-read for a year fail the run.
      - name: Property tests, deep profile
        if: ${{ github.event_name == 'schedule' }}
        env:
          QUINTS_WEEKLY: "1"
        run: uv run pytest packages/quints/tests/test_properties.py -q

  # The check action on books `quints init` scaffolds, with this branch's
  # wheels: it passes on them and fails once they are broken. The pytest
  # golden tests pin the annotation strings.
  action:
    name: Check action on scaffolded books
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The building blocks resolve to this branch's wheels too.
      UV_FIND_LINKS: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: mkdir -p dist && uv build --all-packages # UV_FIND_LINKS must exist
      - name: Scaffold books into a subdirectory
        id: books
        run: |
          set -euo pipefail
          wheel="$(ls "$PWD"/dist/quints-*.whl)"
          uvx --from "$wheel" quints init books/acme --no-git \
            --answers packages/quints/examples/answers.toml
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
      - uses: ./actions/check # zizmor: ignore[self-repository] -- actionlint 1.7 cannot parse $/
        with:
          quints: ${{ steps.books.outputs.wheel }}
          working-directory: books/acme
      - name: Break the books
        run: |
          printf '\n%s\n  %s\n  %s\n' '2026-12-01 * "Broken" "does not balance"' \
            'Assets:CH:GmbH:Current:UBS:CHF  1.00 CHF' 'Equity:CH:GmbH:Capital:Share  -2.00 CHF' \
            >> books/acme/books/2026.bean
      - id: broken
        uses: ./actions/check # zizmor: ignore[self-repository] -- actionlint 1.7 cannot parse $/
        continue-on-error: true
        with:
          quints: ${{ steps.books.outputs.wheel }}
          working-directory: books/acme
      - name: The broken books failed the check
        env:
          OUTCOME: ${{ steps.broken.outcome }}
        run: test "$OUTCOME" = failure

  # The invoices claim PDF/A-3a + PDF/UA-1; veraPDF checks they are.
  pdf:
    name: PDF/A and PDF/UA validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --all-packages
      - run: make pdfcheck

  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --all-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # No job lints the workflows: treefmt in the flake check runs actionlint and zizmor.
  flake-check:
    name: nix flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix flake check -L

  docs-lint:
    name: markdownlint and lychee
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix develop -c make docs-lint
      # The rate tables cite legal sources. A weekly run checks that they load.
      - name: Legal sources
        if: ${{ github.event_name == 'schedule' }}
        run: nix develop -c make legal-links
