# Publish all five distributions to PyPI on a version tag (v1.2.3).
# Trusted publishing (OIDC) — no API token. `quints` imports the
# beangulp-*/beanprice-* building blocks at runtime, so they must be on PyPI
# too or `uvx quints` cannot resolve.
#
# Each package publishes from its own GitHub environment (`pypi-<package>`),
# because PyPI rejects two *pending* trusted publishers with the identical
# (repo, workflow, environment) configuration — one environment shared by all
# five can only ever be registered for one project name. On PyPI, register the
# publisher for each project with environment `pypi-<package>`.
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build all distributions 📦
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the tagged source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          # A release builds from a clean slate, never from a restored cache.
          enable-cache: false
      - run: uv sync --all-packages
      - name: Quality gate
        run: make check
      - name: Build all workspace distributions
        run: uv build --all-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-to-pypi:
    name: Publish ${{ matrix.package }} 🐍 to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - quints
          - beangulp-mt940
          - beangulp-stripe
          - beangulp-wise
          - beangulp-yapeal
          - beanprice-bazg
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/p/${{ matrix.package }}
    permissions:
      id-token: write        # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Select this package's distributions
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir package-dist
          cp dist/"${PACKAGE//-/_}"-* package-dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: package-dist
          # Building blocks are versioned independently of quints; a tag that
          # doesn't bump one of them re-builds an already-published version.
          skip-existing: true

  github-release:
    name: Sign 📦 with Sigstore and create a GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the release
      id-token: write        # sigstore signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Sign the distribution with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Create the GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "quints $GITHUB_REF_NAME"
          --notes ""
      - name: Upload the signed distribution to the Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME" dist/**
          --repo "$GITHUB_REPOSITORY"
